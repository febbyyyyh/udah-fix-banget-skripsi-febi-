version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: titik_jeda_app
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-sql_titikjeda_online}
      - DB_PASSWORD=${DB_PASSWORD:-ec5d2cc0c70bf8}
      - DB_NAME=${DB_NAME:-sql_titikjeda_online}
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-secret_jwt_titik_jeda_2024}
    depends_on:
      - db
    volumes:
      # Menyimpan folder uploads agar persisten meskipun container mati
      - app_uploads:/app/backend/uploads
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: titik_jeda_db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=${DB_NAME:-sql_titikjeda_online}
      - MYSQL_USER=${DB_USER:-sql_titikjeda_online}
      - MYSQL_PASSWORD=${DB_PASSWORD:-ec5d2cc0c70bf8}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password_123}
    volumes:
      # Menyimpan data database agar persisten
      - db_data:/var/lib/mysql
      # Otomatis meng-import file database.sql saat pertama kali database dibuat
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    restart: unless-stopped

volumes:
  db_data:
  app_uploads:
