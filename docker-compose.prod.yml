services:
  # 1. CONTAINER DATABASE (MySQL)
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-mental_health_app}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. CONTAINER BACKEND (Express JS) - image GHCR, volume uploads persisten
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/febbyyyyh/titik-jeda-backend:main}
    container_name: express_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-mental_health_app}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases: [express_backend]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||5000)+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 3. CONTAINER FRONTEND (nginx serving built SPA dari GHCR)
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/febbyyyyh/titik-jeda-frontend:main}
    container_name: react_frontend
    restart: always
    ports:
      - "3001:80"
    volumes:
      # override nginx conf: client_max_body_size 700m (default 1m -> 413)
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
