# autodeploy-conf-test
server {
    listen 80;
    server_name localhost mentalsehat.unsrat.ac.id 172.16.222.8;

    # Upload media (audio/video) bisa ratusan MB. Default nginx hanya 1m.
    client_max_body_size 700m;
    client_body_timeout 300s;
    client_body_buffer_size 128k;

    # Docker embedded DNS: resolve nama container SAAT REQUEST, bukan saat start,
    # supaya nginx tidak crash-loop kalau backend di-recreate oleh auto-deploy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy request API ke container Backend
    location /api/ {
        set $backend_upstream http://express_backend:5000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_max_temp_file_size 0;
    }

    # Proxy request file Uploads (gambar/audio/video)
    location /uploads/ {
        set $uploads_upstream http://express_backend:5000;
        proxy_pass $uploads_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        add_header Accept-Ranges bytes;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
